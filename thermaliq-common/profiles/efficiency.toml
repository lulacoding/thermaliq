# Sensor and fan IDs here (cpu_temp, gpu_temp, cpu_fan, gpu_fan, case_fans) are role IDs, not real hardware IDs.
# roles.toml (written by `thermaliq-daemon identify`, SPEC 5.2) maps them to this PC's hardware when the profile loads.

name = "efficiency"
description = "Low power: low fan speeds while cool"

[[curves]]
id = "cpu"
type = "linear"
source = "cpu_temp"
min_temp = 45
max_temp = 85
min_pwm = 25
max_pwm = 100

[[curves]]
id = "gpu"
type = "linear"
source = "gpu_temp"
min_temp = 45
max_temp = 85
min_pwm = 25
max_pwm = 100

[[controls]]
fan = "case_fans"
curve = "cpu"
step_down_pct = 3
min_pwm = 25

[[controls]]
fan = "gpu_fan"
curve = "gpu"
step_down_pct = 3
min_pwm = 25

[[alerts]]
sensor = "cpu_temp"
threshold = 85
severity = "warn"
action = { type = "notify" }

[[alerts]]
sensor = "cpu_temp"
threshold = 92
severity = "crit"
action = { type = "log" }

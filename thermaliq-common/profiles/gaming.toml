# Sensor and fan IDs here (cpu_temp, gpu_temp, cpu_fan, gpu_fan, case_fans) are role IDs, not real hardware IDs.
# roles.toml (written by `thermaliq-daemon identify`, SPEC 5.2) maps them to this PC's hardware when the profile loads.

name = "gaming"
description = "Aggressive CPU and GPU curves, chassis reacts to load"

[[curves]]
id = "cpu_aggressive"
type = "linear"
source = "cpu_temp"
min_temp = 35
max_temp = 75
min_pwm = 35
max_pwm = 100

[[curves]]
id = "gpu_curve"
type = "linear"
source = "gpu_temp"
min_temp = 35
max_temp = 75
min_pwm = 35
max_pwm = 100

[[curves]]
id = "chassis_gaming"
type = "trigger"
source = "cpu_temp"
idle_temp = 45
idle_pwm = 35
load_temp = 70
load_pwm = 90
response_ms = 2000

[[controls]]
fan = "cpu_fan"
curve = "cpu_aggressive"
step_up_pct = 15
step_down_pct = 3
min_pwm = 35

[[controls]]
fan = "gpu_fan"
curve = "gpu_curve"
step_up_pct = 15
step_down_pct = 3
min_pwm = 35

[[controls]]
fan = "case_fans"
curve = "chassis_gaming"
step_up_pct = 15
step_down_pct = 3
min_pwm = 35

[[alerts]]
sensor = "cpu_temp"
threshold = 85
severity = "warn"
action = { type = "notify" }

[[alerts]]
sensor = "gpu_temp"
threshold = 85
severity = "crit"
action = { type = "notify" }

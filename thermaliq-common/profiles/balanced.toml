# Sensor and fan IDs here (cpu_temp, gpu_temp, cpu_fan, gpu_fan, case_fans) are role IDs, not real hardware IDs.
# roles.toml (written by `tq identify`, SPEC 5.2) maps them to this PC's hardware when the profile loads.

name = "balanced"
description = "Default: moderate noise and temperatures"

[[curves]]
id = "cpu"
type = "linear"
source = "cpu_temp"
min_temp = 40
max_temp = 80
min_pwm = 30
max_pwm = 100

[[curves]]
id = "gpu"
type = "linear"
source = "gpu_temp"
min_temp = 40
max_temp = 80
min_pwm = 30
max_pwm = 100

[[controls]]
fan = "case_fans"
curve = "cpu"
step_down_pct = 3
min_pwm = 30

[[controls]]
fan = "gpu_fan"
curve = "gpu"
step_down_pct = 3
min_pwm = 30

[[alerts]]
sensor = "cpu_temp"
threshold = 85
severity = "warn"
action = { type = "notify" }

[[alerts]]
sensor = "cpu_temp"
threshold = 92
severity = "crit"
action = { type = "log" }

ShortDescription: AI-powered fan control for Windows, macOS, and Linux
Description: |-
  ThermalIQ is an open-source fan controller with a 24/7 AI agent that monitors
  your hardware and adjusts fan speeds automatically. It reads sensor data via
  HWiNFO64 on Windows and provides GPU fan control via NVML for NVIDIA cards.

  Features:
  - 10 fan curve types including AI, predictive, and learning modes
  - Real-time sensor monitoring via HWiNFO64 shared memory
  - NVIDIA GPU fan control via NVML
  - REST API + WebSocket for live sensor data
  - Tauri desktop UI with dashboard and alert center
  - CLI tool (tq) for scripting and headless use

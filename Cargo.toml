[workspace]
members = [
    "thermaliq-common",
    "thermaliq-hal",
    "thermaliq-daemon",
    "thermaliq-cli",
    "thermaliq-helper",
]
exclude = ["thermaliq-ui"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["ThermalIQ Contributors"]
license = "MIT"
repository = "https://github.com/thermaliq/thermaliq"

[workspace.dependencies]
anyhow = "1"
libc = "0.2"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"
chrono = { version = "0.4", features = ["clock"] }

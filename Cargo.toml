[workspace]
members = [
    "thermaliq-common",
    "thermaliq-hal",
    "thermaliq-engine",
    "thermaliq-agent",
    "thermaliq-daemon",
    "thermaliq-cli",
]
resolver = "2"

[workspace.package]
version = "2.0.0-dev.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/lulacoding/thermaliq"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"

# SPEC S5: Engine::drop hands fans back on panic, which needs unwinding.
# Never set panic = "abort" (v0's Tauri crate did).
[profile.release]
panic = "unwind"

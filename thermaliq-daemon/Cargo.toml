[package]
name = "thermaliq-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
thermaliq-common = { path = "../thermaliq-common" }
thermaliq-hal = { path = "../thermaliq-hal" }
thermaliq-engine = { path = "../thermaliq-engine" }
toml = "1.1.8"
getrandom = "0.3"
rusqlite = { version = "0.41.1", features = ["bundled"] }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
tower-http = { version = "0.6", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
futures-util = "0.3"
tempfile = "3"
tokio-tungstenite = "0.26"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true

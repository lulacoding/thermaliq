[package]
name = "thermaliq-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
thermaliq-common = { path = "../thermaliq-common" }
thermaliq-hal = { path = "../thermaliq-hal" }
thermaliq-engine = { path = "../thermaliq-engine" }
thermaliq-agent = { path = "../thermaliq-agent" }
toml = "1.1.8"
getrandom = "0.3"
rusqlite = { version = "0.41.1", features = ["bundled"] }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
tower-http = { version = "0.6", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

ctrlc = { version = "3.5", features = ["termination"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"

[features]
# Fake hardware for dev and CI. A build without it refuses to start (no backend until M10).
mock-hardware = []
# Gate G1 fault injection (THERMALIQ_INJECT_CPU_TEMP). Debug builds only; release refuses to compile.
gate-tests = []

[dev-dependencies]
futures-util = "0.3"
tempfile = "3"
tokio-tungstenite = "0.26"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true

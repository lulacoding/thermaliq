[package]
name = "thermaliq-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
thermaliq-common = { path = "../thermaliq-common" }
thermaliq-hal = { path = "../thermaliq-hal" }
thermaliq-engine = { path = "../thermaliq-engine" }
thermaliq-agent = { path = "../thermaliq-agent" }
toml = "1.1.8"
getrandom = "0.3"
rusqlite = { version = "0.41.1", features = ["bundled"] }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
tower-http = { version = "0.6", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3.5"

ctrlc = { version = "3.5", features = ["termination"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
# Fake hardware for dev and CI. A build without it refuses to start (no backend until M10).
mock-hardware = []
# Gate G1 fault injection (THERMALIQ_INJECT_CPU_TEMP). Debug builds only; release refuses to compile.
gate-tests = []

[dev-dependencies]
# The real-server test of the CLI client. The CLI never depends on the daemon.
thermaliq-cli = { path = "../thermaliq-cli" }
futures-util = "0.3"
tempfile = "3"
tokio-tungstenite = "0.26"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true

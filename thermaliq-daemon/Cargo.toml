[package]
name = "thermaliq-daemon"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
# Propagates mock-hardware to the HAL crate.
# Use `cargo run --features mock-hardware` for development without real hardware.
default = []
mock-hardware = ["thermaliq-hal/mock-hardware"]

[dependencies]
thermaliq-hal = { path = "../thermaliq-hal" }
thermaliq-common = { path = "../thermaliq-common" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
axum = { version = "0.7", features = ["macros", "ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }
rand = "0.8"
hex = "0.4"
dirs = "5"
toml = { workspace = true }
rusqlite = { version = "0.31", features = ["bundled"] }
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
sysinfo = { version = "0.31", default-features = false, features = ["system"] }
reqwest = { version = "0.12", features = ["json"] }
chrono = { workspace = true }
async-trait = "0.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-service = "0.8"

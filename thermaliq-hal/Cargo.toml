[package]
name = "thermaliq-hal"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
# Enable mock hardware implementations for CI and development without physical hardware.
# All platform sensor/fan calls return deterministic fake data when this feature is active.
# Usage: cargo test --features mock-hardware
# CI: cargo test --all-features (implies mock-hardware via --features mock-hardware)
default = []
mock-hardware = []

[dependencies]
thermaliq-common = { path = "../thermaliq-common" }
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_Com",
    "Win32_System_Wmi",
] }
nvml-wrapper = "0.10"
widestring = "1"
libloading = "0.8"

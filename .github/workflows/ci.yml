name: CI

on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]

env:
  CARGO_TERM_COLOR: always
  CLAUDE_CODE_DISABLE_AUTO_MEMORY: "1"

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo clippy -p thermaliq-daemon --all-targets --features mock-hardware -- -D warnings
      - run: cargo test -p thermaliq-daemon --features mock-hardware
      - run: cargo clippy -p thermaliq-daemon --all-targets --features gate-tests -- -D warnings
      - run: cargo test -p thermaliq-daemon --features gate-tests,mock-hardware
      - name: Service smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build -p thermaliq-daemon --features mock-hardware
          ./scripts/service-smoke.ps1

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: thermaliq-linux-x86_64
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: thermaliq-macos-intel
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: thermaliq-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: thermaliq-windows-x86_64

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      # ── Linux ─────────────────────────────────────────────────────────────

      - name: Build release binaries (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/tq dist/
          cp target/${{ matrix.target }}/release/thermaliq-daemon dist/
          tar czf ${{ matrix.artifact }}.tar.gz -C dist tq thermaliq-daemon

      # ── macOS ─────────────────────────────────────────────────────────────

      - name: Build release binaries (macOS)
        if: startsWith(matrix.os, 'macos')
        run: cargo build --release --target ${{ matrix.target }}

      - name: Import Apple signing certificate (macOS)
        if: startsWith(matrix.os, 'macos') && env.HAVE_APPLE_CERT == 'true'
        env:
          HAVE_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' && 'true' || 'false' }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/thermaliq.keychain-db"
          # Generate ephemeral password — passed via env var, not as a CLI argument,
          # to avoid exposure in the process list.
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$APPLE_CERTIFICATE" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          # Remove temp cert file immediately after import to avoid leaking it
          rm -f /tmp/cert.p12
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Build Tauri app (macOS)
        if: startsWith(matrix.os, 'macos')
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: thermaliq-ui
          args: --target ${{ matrix.target }}

      - name: Notarize DMG with xcrun notarytool (macOS)
        # Use xcrun notarytool directly — Tauri's built-in notarize hangs (tauri#14579/#8630)
        # HAVE_APPLE_ID is derived from the secret at step-env level (mirrors HAVE_APPLE_CERT pattern)
        if: startsWith(matrix.os, 'macos') && env.HAVE_APPLE_ID == 'true'
        env:
          HAVE_APPLE_ID: ${{ secrets.APPLE_ID != '' && 'true' || 'false' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG=$(find thermaliq-ui/src-tauri/target/release/bundle/dmg -name "*.dmg" 2>/dev/null | head -1)
          if [ -n "$DMG" ]; then
            xcrun notarytool submit "$DMG" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_ID_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait --timeout 1800
            xcrun stapler staple "$DMG"
            echo "Notarized: $DMG"
          fi

      - name: Package CLI (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/tq dist/
          cp target/${{ matrix.target }}/release/thermaliq-daemon dist/
          tar czf ${{ matrix.artifact }}.tar.gz -C dist tq thermaliq-daemon

      # ── Windows ───────────────────────────────────────────────────────────

      - name: Build release binaries (Windows)
        if: matrix.os == 'windows-latest'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage daemon binary for Tauri bundle (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path thermaliq-ui\src-tauri\resources | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\thermaliq-daemon.exe" `
                    "thermaliq-ui\src-tauri\resources\thermaliq-daemon.exe"

      - name: Build Tauri app (Windows)
        if: matrix.os == 'windows-latest'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: thermaliq-ui
          args: --target ${{ matrix.target }}

      - name: Check signing secrets (Windows)
        # On stable release tags (vX.Y.Z — no pre-release suffix), missing signing
        # secrets are a hard error. Beta/RC tags (v*-alpha, v*-beta, v*-rc.*) and
        # manual workflow_dispatch may proceed unsigned with a warning.
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          ESIGNER_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $isStableTag = ($env:EVENT_NAME -eq 'push') -and ($env:REF_NAME -match '^v[0-9]+\.[0-9]+\.[0-9]+$')
          if ($isStableTag -and (-not $env:ESIGNER_USERNAME)) {
            Write-Error "ESIGNER_USERNAME secret is required for stable release tags but is not set. Configure ssl.com eSigner credentials before publishing a stable release."
            exit 1
          }
          if (-not $env:ESIGNER_USERNAME) {
            Write-Warning "ESIGNER_USERNAME not set — skipping code signing (acceptable for prerelease/manual dispatch)"
          }

      - name: Sign with ssl.com eSigner (Windows)
        # Requires secrets: ESIGNER_USERNAME, ESIGNER_PASSWORD,
        # ESIGNER_TOTP_SECRET, ESIGNER_CREDENTIAL_ID
        # Sign up at https://www.ssl.com/esigner/ (EV cert preferred for SmartScreen reputation)
        #
        # To update CodeSignTool version:
        #   1. Download new zip from https://github.com/SSLcom/CodeSignTool/releases
        #   2. Compute: sha256sum CodeSignTool-vX.Y.Z-windows.zip
        #   3. Update CODESIGNTOOL_URL and EXPECTED_SHA256 below
        if: matrix.os == 'windows-latest' && env.ESIGNER_USERNAME != ''
        env:
          ESIGNER_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
          ESIGNER_PASSWORD: ${{ secrets.ESIGNER_PASSWORD }}
          ESIGNER_TOTP_SECRET: ${{ secrets.ESIGNER_TOTP_SECRET }}
          ESIGNER_CREDENTIAL_ID: ${{ secrets.ESIGNER_CREDENTIAL_ID }}
        run: |
          $CODESIGNTOOL_URL = "https://github.com/SSLcom/CodeSignTool/releases/download/v1.3.2/CodeSignTool-v1.3.2-windows.zip"
          $EXPECTED_SHA256  = "7e18b23a03e6c2ead2c8ec96e37905bc40fb41cab0c5b68dc0fcf8ee4e2fd7f3"
          $ZIP = "$env:RUNNER_TEMP\CodeSignTool.zip"
          $DIR = "$env:RUNNER_TEMP\CodeSignTool"

          Invoke-WebRequest -Uri $CODESIGNTOOL_URL -OutFile $ZIP -UseBasicParsing

          # Verify integrity before execution — fail hard on mismatch
          $ACTUAL_SHA256 = (Get-FileHash -Path $ZIP -Algorithm SHA256).Hash.ToLower()
          if ($ACTUAL_SHA256 -ne $EXPECTED_SHA256) {
            Write-Error "CodeSignTool SHA256 mismatch!`nExpected: $EXPECTED_SHA256`nActual:   $ACTUAL_SHA256"
            exit 1
          }

          Expand-Archive -Path $ZIP -DestinationPath $DIR -Force
          $TOOL = (Get-ChildItem -Path $DIR -Filter "CodeSignTool.bat" -Recurse).FullName

          # Collect files to sign
          $FILES = @(
            "target\${{ matrix.target }}\release\thermaliq-daemon.exe",
            "target\${{ matrix.target }}\release\tq.exe"
          )
          $NSIS = Get-ChildItem `
            -Path "thermaliq-ui\src-tauri\target\release\bundle\nsis" `
            -Filter "*_x64-setup.exe" -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($NSIS) { $FILES += $NSIS.FullName }

          foreach ($FILE in $FILES) {
            if (Test-Path $FILE) {
              Write-Host "Signing: $FILE"
              & cmd /c "`"$TOOL`" sign" `
                "-username=$env:ESIGNER_USERNAME" `
                "-password=$env:ESIGNER_PASSWORD" `
                "-credential_id=$env:ESIGNER_CREDENTIAL_ID" `
                "-totp_secret=$env:ESIGNER_TOTP_SECRET" `
                "-input_file_path=`"$FILE`"" `
                "-override=true"
              if ($LASTEXITCODE -ne 0) {
                Write-Error "Signing failed for $FILE"
                exit 1
              }
            }
          }
        shell: pwsh

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\tq.exe" dist\
          Copy-Item "target\${{ matrix.target }}\release\thermaliq-daemon.exe" dist\
          $NSIS = Get-ChildItem `
            -Path "thermaliq-ui\src-tauri\target\release\bundle\nsis" `
            -Filter "*_x64-setup.exe" -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($NSIS) { Copy-Item $NSIS.FullName dist\ }
          Compress-Archive -Path dist\* -DestinationPath "${{ matrix.artifact }}.zip"
        shell: pwsh

      # ── Upload ─────────────────────────────────────────────────────────────

      - name: Upload artifact (Unix)
        if: matrix.os != 'windows-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

      - name: Upload artifact (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  # ── GitHub Release ─────────────────────────────────────────────────────────

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout@v4
        with:
          fetch-depth: 0  # Required for git-cliff to access full history

      - name: Generate CHANGELOG with git-cliff
        uses: orhun/git-cliff-action@c93ef52f3d0ddcdcc9bd5447d98d458a11cd4f72 # orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Generate winget manifest
        if: "!contains(github.ref, '-')"
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Extract version from tag (strip 'v' prefix)
          VERSION="${REF_NAME#v}"

          # Create new winget manifest directory
          WINGET_DIR="packaging/winget/manifests/l/LulaCoding/ThermalIQ/$VERSION"
          mkdir -p "$WINGET_DIR"

          # Copy and update manifest files from 1.0.0 template
          for file in packaging/winget/manifests/l/LulaCoding/ThermalIQ/1.0.0/*; do
            filename=$(basename "$file")
            sed "s/1\.0\.0/$VERSION/g" "$file" > "$WINGET_DIR/$filename"
          done

          # Find the NSIS installer in artifacts — hard-fail if missing (no placeholder SHA)
          NSIS_FILE=$(find artifacts -name "*_x64-setup.exe" -type f | head -1)
          if [ -z "$NSIS_FILE" ]; then
            echo "ERROR: NSIS installer not found in artifacts. Cannot generate winget manifest with a real SHA256." >&2
            echo "Ensure the Windows Tauri build succeeded and uploaded the *_x64-setup.exe artifact." >&2
            exit 1
          fi
          SHA256=$(sha256sum "$NSIS_FILE" | awk '{print $1}')

          # Update installer SHA256 and URL
          INSTALLER_YAML="$WINGET_DIR/LulaCoding.ThermalIQ.installer.yaml"
          sed -i.bak "s/InstallerSha256: .*/InstallerSha256: $SHA256/" "$INSTALLER_YAML" && rm "$INSTALLER_YAML.bak"
          sed -i.bak "s|InstallerUrl: .*|InstallerUrl: https://github.com/lulacoding/thermaliq/releases/download/v$VERSION/ThermalIQ_${VERSION}_x64-setup.exe|" "$INSTALLER_YAML" && rm "$INSTALLER_YAML.bak"

          # Package manifests as artifact for manual submission to winget-pkgs
          # See packaging/winget/README.md for submission instructions
          tar czf "winget-manifests-$VERSION.tar.gz" -C packaging/winget/manifests l/
          echo "Winget manifests generated for version $VERSION"
          echo "Submit via: wingetcreate submit (see packaging/winget/README.md)"

      - name: Read CHANGELOG for release body
        id: changelog
        run: |
          # Extract the first release section (up to next ## or end of file)
          sed -n '/^## \[/,/^## \[/p' CHANGELOG.md | head -n -1 > /tmp/release_notes.md
          # Append installation instructions
          cat >> /tmp/release_notes.md << 'EOF'

## Installation

**Windows**

Download the NSIS installer below. After the winget manifest is submitted to winget-pkgs,
you will be able to install via:
```powershell
winget install LulaCoding.ThermalIQ
```
See [packaging/winget/README.md](packaging/winget/README.md) for submission status.

**macOS**
```bash
brew tap thermaliq/tap && brew install thermaliq
```
Or download the DMG below.

**Linux**
```bash
curl -fsSL https://thermaliq.dev/install.sh | sh
```
EOF
          # Store the result in an environment variable for use in the release
          BODY=$(cat /tmp/release_notes.md)
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Generate latest.json update manifest
        # Gated on TAURI_SIGNING_PRIVATE_KEY so unsigned dev/fork runs are no-ops.
        # Format: https://tauri.app/plugin/updater/#update-server
        # Built with `jq` to avoid heredoc indentation + shell injection pitfalls,
        # then validated with `jq -e .` so malformed JSON fails the job loudly.
        if: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          VERSION=${{ github.ref_name }}
          VERSION=${VERSION#v}
          PUBDATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Debug: list all artifacts produced by tauri-action so sig-pattern
          # mismatches can be diagnosed from CI logs.
          echo "== artifacts tree =="
          find artifacts -type f | sort

          # Read the first .sig file matching a glob and return its contents.
          # Fails the job if no match is found (signature verification would
          # fail silently otherwise, bricking the updater).
          read_sig() {
            local label="$1"
            local pattern="$2"
            local file
            file=$(find artifacts -type f -name "$pattern" 2>/dev/null | head -1)
            if [ -z "$file" ]; then
              echo "ERROR: no signature file matched '$pattern' for $label" >&2
              echo "       Check tauri-action bundle target names." >&2
              exit 1
            fi
            cat "$file"
          }

          WIN_URL="https://github.com/lulacoding/thermaliq/releases/download/v${VERSION}/ThermalIQ_${VERSION}_x64-setup.exe"
          MAC_ARM_URL="https://github.com/lulacoding/thermaliq/releases/download/v${VERSION}/ThermalIQ_${VERSION}_aarch64.dmg"
          MAC_X64_URL="https://github.com/lulacoding/thermaliq/releases/download/v${VERSION}/ThermalIQ_${VERSION}_x64.dmg"
          LIN_URL="https://github.com/lulacoding/thermaliq/releases/download/v${VERSION}/thermaliq_${VERSION}_amd64.AppImage"

          # tauri-action emits signatures next to each bundle:
          #   *.nsis.zip.sig     — windows NSIS updater bundle
          #   *.app.tar.gz.sig   — macOS updater bundle (per-arch)
          #   *.AppImage.tar.gz.sig — linux AppImage updater bundle
          WIN_SIG=$(read_sig "windows-x86_64" "*-setup.nsis.zip.sig")
          MAC_ARM_SIG=$(read_sig "darwin-aarch64" "*aarch64.app.tar.gz.sig")
          MAC_X64_SIG=$(read_sig "darwin-x86_64" "*x64.app.tar.gz.sig")
          LIN_SIG=$(read_sig "linux-x86_64" "*amd64.AppImage.tar.gz.sig")

          # Build JSON via jq so values are properly escaped and no heredoc
          # indentation can leak into the payload.
          jq -n \
            --arg version "$VERSION" \
            --arg notes "See https://github.com/lulacoding/thermaliq/releases/tag/v${VERSION}" \
            --arg pub_date "$PUBDATE" \
            --arg win_url "$WIN_URL" --arg win_sig "$WIN_SIG" \
            --arg mac_arm_url "$MAC_ARM_URL" --arg mac_arm_sig "$MAC_ARM_SIG" \
            --arg mac_x64_url "$MAC_X64_URL" --arg mac_x64_sig "$MAC_X64_SIG" \
            --arg lin_url "$LIN_URL" --arg lin_sig "$LIN_SIG" \
            '{
               version: $version,
               notes: $notes,
               pub_date: $pub_date,
               platforms: {
                 "windows-x86_64":  { signature: $win_sig,     url: $win_url     },
                 "darwin-aarch64":  { signature: $mac_arm_sig, url: $mac_arm_url },
                 "darwin-x86_64":   { signature: $mac_x64_sig, url: $mac_x64_url },
                 "linux-x86_64":    { signature: $lin_sig,     url: $lin_url     }
               }
             }' > latest.json

          # Validate: fail the job if the output is not well-formed JSON, or if
          # any signature is empty (would bypass updater verification silently).
          jq -e . latest.json > /dev/null
          jq -e '.platforms | to_entries | all(.value.signature != "" and .value.url != "")' latest.json > /dev/null || {
            echo "ERROR: latest.json has empty signature or url" >&2
            cat latest.json >&2
            exit 1
          }
          echo "Generated latest.json for v${VERSION}"
          cat latest.json

      - name: Create draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            artifacts/**/*
            latest.json
          body: ${{ steps.changelog.outputs.body }}

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-13, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        # TODO(v1.0.0): Replace mock-hardware with real hardware build.
        # Requires platform-specific toolchain setup and driver dependencies.
        run: cargo build --release --features mock-hardware

      # TODO(v1.0.0): Add the following steps:
      # - macOS: Import APPLE_CERTIFICATE secret, run tauri-apps/tauri-action,
      #   notarize with xcrun notarytool (not Tauri's built-in — see issue #14579),
      #   staple with xcrun stapler. Secrets needed: APPLE_CERTIFICATE,
      #   APPLE_CERTIFICATE_PASSWORD, APPLE_ID, APPLE_ID_PASSWORD, APPLE_TEAM_ID,
      #   APPLE_SIGNING_IDENTITY, TAURI_SIGNING_PRIVATE_KEY.
      # - Windows: Sign with SignPath.io or ssl.com eSigner (EV cert preferred
      #   for SmartScreen reputation). Cannot use USB HSM in Actions.
      # - All: Upload artifacts and create GitHub Release via softprops/action-gh-release.
      # - Post-release: Submit to winget (up to 4 weeks review for new publishers),
      #   update Homebrew tap, update AUR thermaliq-bin PKGBUILD.

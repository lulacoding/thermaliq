name: Bug Report
description: Report a bug or unexpected behaviour
labels: [bug]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Windows, Linux, macOS]
    validations:
      required: true
  - type: input
    id: os_version
    attributes:
      label: OS Version
      placeholder: "e.g. Ubuntu 22.04, macOS 15.2, Windows 11 23H2"
    validations:
      required: true
  - type: input
    id: thermaliq_version
    attributes:
      label: ThermalIQ Version
      placeholder: "e.g. 0.1.0 or git SHA"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clear description of the bug
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: "1. Start daemon\n2. ...\n3. See error"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Run with RUST_LOG=debug for verbose output
      render: shell

name: Bug Report
description: Report a bug or unexpected behaviour
labels: [bug]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Windows 10, Windows 11, macOS (Intel), macOS (Apple Silicon), Linux]
    validations:
      required: true

  - type: input
    id: os_version
    attributes:
      label: OS Version
      placeholder: "e.g. Windows 11 23H2, Ubuntu 22.04, macOS 15.2"
    validations:
      required: true

  - type: input
    id: thermaliq_version
    attributes:
      label: ThermalIQ Version
      placeholder: "e.g. 1.0.0 (run: tq status)"
    validations:
      required: true

  - type: dropdown
    id: hwinfo_running
    attributes:
      label: HWiNFO64 running? (Windows only)
      options: ["Yes", "No", "N/A (macOS / Linux)"]
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clear description of the bug
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: "1. Start daemon\n2. Run tq profile set performance\n3. See error"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "Run: RUST_LOG=debug thermaliq-daemon 2>&1 | head -100"
      render: shell

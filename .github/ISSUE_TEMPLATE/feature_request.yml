name: Feature Request
description: Propose a new feature or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this solve? What are you trying to do that you cannot do today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe what you want to happen.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Fan control / curves
        - AI agent
        - Hardware support (new device)
        - CLI
        - UI (desktop app)
        - API
        - Profiles / scheduling
        - Distribution / packaging
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Other approaches you have thought about.

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Links, screenshots, or anything else that helps.

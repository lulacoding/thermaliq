name = "balanced"
description = "Balanced noise and cooling"
version = 1

[[curves]]
type = "linear"
id = "cpu_linear"
source = "cpu_package"
min_temp = 40.0
max_temp = 80.0
min_pwm = 20
max_pwm = 100

[[curves]]
type = "flat"
id = "chassis_flat"
pwm = 40

[[controls]]
fan = "cpu_fan_0"
curve = "cpu_linear"
mode = "pwm"
step_up_pct = 10
step_down_pct = 3
min_pwm = 20

[[alerts]]
sensor = "cpu_package"
threshold = 90.0
severity = "warn"
action = "notify"

[[alerts]]
sensor = "cpu_package"
threshold = 95.0
severity = "crit"
action = "apply_profile"
profile = "performance"
